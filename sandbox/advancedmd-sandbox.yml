approval_gate:
  note: >-
    Portal registration and sandbox access are self-service, but an application only
    becomes usable after AdvancedMD Interoperability Support approves it — email
    InterOps@advancedmd.com with subject "FHIR App Approval Request for Appname: [Your
    Appname]" and the redirect URL. AdvancedMD states this "can take a few days". One
    product per application: a Single app must not also request the Bulk or non-FHIR products.
  custom_sandbox: >-
    Practices that want testing against their own organization can request a sandbox base
    URL through the InterOps Support page.
