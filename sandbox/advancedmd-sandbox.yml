bulk_test_data:
  group_ids: ['991900', '991901']
  note: These test groups contain the clinical data for all published test patients.
  kickoff_example:
    request: GET https://providerapi.advancedmd.com/v1/r4/Group/991900/$export
    parameters:
      required: {OfficeKey: '991900', groupId: '991900', prefer: respond-async}
      optional: [_type, _since]
    expected: HTTP 202 Accepted — export job started
