generated: '2026-07-27'
method: searched
source: >-
  https://fhir.advancedmd.com/fhir/test-data, https://fhir.advancedmd.com/fhir/base-urls,
  https://fhir.advancedmd.com/fhir/single-api, https://fhir.advancedmd.com/fhir/bulk-api,
  https://fhir.advancedmd.com/getting-started — fetched 2026-07-27. Every value below is
  published verbatim by AdvancedMD on its public FHIR developer portal as test-only data;
  nothing here was invented.
description: >-
  AdvancedMD runs its sandbox as two named test organizations inside the production FHIR
  service rather than as a separate host or key prefix. Test and live are separated by
  organization id in the base URL and by the office key ("license key") supplied at login,
  not by credential format — there is no sk_test/sk_live style distinction. A hosted SMART
  App Launch simulator on the portal lets a developer complete the whole authorization
  dance and copy out a real bearer token without writing an app.
docs:
  - https://fhir.advancedmd.com/fhir/test-data
  - https://fhir.advancedmd.com/fhir/base-urls
  - https://fhir.advancedmd.com/fhir/single-api
  - https://fhir.advancedmd.com/fhir/bulk-api
separation:
  model: organization-scoped
  note: >-
    Test data lives in the production FHIR service under dedicated test organizations.
    The same authorization endpoints, token endpoint and API host serve test and live
    traffic; the office key and org id select the dataset.
test_organizations:
  - name: FHIR PRACTICE GROUP TEST
    base_url: https://providerapi.advancedmd.com/v1/r4/174
    office_key: '991900'
  - name: FHIR PRACTICE GROUP TEST 2
    base_url: https://providerapi.advancedmd.com/v1/r4/175
    office_key: '991901'
example_requests:
  - https://providerapi.advancedmd.com/v1/r4/174/AllergyIntolerance
  - https://providerapi.advancedmd.com/v1/r4/174/CarePlan
hosted_tools:
  smart_app_launch:
    url: https://providerapi.advancedmd.com/v1/fhir-smartapp-launch?aud=https%3A%2F%2Fproviderapi.advancedmd.com%2Fv1%2Fr4&scope=openid%20fhirUser%20offline_access%20online_access%20patient%2F*.read
    description: >-
      Portal-hosted SMART app simulator. Pick scopes, Run, sign in as a test patient or
      test provider, consent, then expand the "Access token response" block and copy the
      bearer token into the Try-this-API console on any spec page.
    default_scopes: [openid, fhirUser, offline_access, online_access, 'patient/*.read']
  try_this_api:
    description: Each Apigee spec page has a "Try this API" panel; click Authorize, paste the bearer token, then Execute an operation.
  bulk_jwks_helper:
    endpoint: POST https://providerapi.advancedmd.com/v1/fhir-jwks/token
    body: grant_type=client_credentials&alg=rsa
    auth: HTTP Basic — Bulk application key as username, Bulk application secret as password
    description: >-
      Test-only JWT minting endpoint. AdvancedMD states production Bulk applications must
      generate and register their own JWTs and should not call this endpoint.
