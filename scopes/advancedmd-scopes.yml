generated: '2026-07-27'
method: searched
source: https://providerapi.advancedmd.com/v1/r4/.well-known/smart-configuration (HTTP 200, saved verbatim
  at fhir/advancedmd-smart-configuration.json) — scopes_supported enumerated live on 2026-07-27.
docs: https://fhir.advancedmd.com/fhir/launch-and-authorization
description: SMART-on-FHIR OAuth 2.0 scope surface for the AdvancedMD certified FHIR APIs. The three OpenAPI
  documents in openapi/ declare only a bare bearerAuth scheme and carry no oauth2 flows, so the scope
  set is taken from the provider's published SMART discovery document and the portal authorization page
  rather than derived from the specs.
standard: SMART App Launch — SMART v1 (.read) and SMART v2 granular (.rs) scope syntax, both advertised
  via the permission-v1 and permission-v2 capabilities.
schemes:
- name: SMART-on-FHIR OAuth 2.0
  issuer: https://providerapi.advancedmd.com/v1/r4
  source: fhir/advancedmd-smart-configuration.json
  flows:
  - flow: authorizationCode
    authorizationUrl: https://providerapi.advancedmd.com/v1/oauth2/authorize
    tokenUrl: https://providerapi.advancedmd.com/v1/oauth2/token
    pkce: S256 (code_challenge_methods_supported)
    used_by: Patient and practitioner SMART apps against the FHIR Single API (3-legged OAuth).
  - flow: clientCredentials
    tokenUrl: https://providerapi.advancedmd.com/v1/oauth2/token
    client_authentication: private_key_jwt — RS384-signed client_assertion with client_assertion_type
      urn:ietf:params:oauth:client-assertion-type:jwt-bearer
    used_by: SMART Backend Services authorization for the FHIR Bulk Data API.
  jwks_uri: https://providerapi.advancedmd.com/v1/oauth2/.well-known/jwks.json
  introspection_endpoint: https://providerapi.advancedmd.com/v1/oauth2/introspect
  revocation_endpoint: https://providerapi.advancedmd.com/v1/oauth2/revoke
  management_endpoint: https://providerapi.advancedmd.com/v1/oauth2/manage
notes:
- 'The portal documents a default requested scope set of: openid fhirUser offline_access online_access
  patient/*.read.'
- The FHIR Launch and Authorization page states that user-level scopes are advertised but "not yet supported"
  in practice, and that the scope set will be extended with FHIR v6 clinical-data scopes; the discovery
  document nonetheless enumerates the full user/* set, so both are recorded here.
- Two-legged OAuth for general system-to-system access is explicitly NOT supported; system/*.read exists
  only for the Bulk Data backend-services flow.
- 'With a user/*.read token the access token still carries a fixed patient context: a request without
  an explicit patient parameter is answered for the launch patient only.'
- The Bulk token request additionally requires username, password and officekey form parameters alongside
  the standard client_credentials parameters.
scope_groups:
  patient: 58
  user: 58
  system: 6
  identity_and_launch: 6
