description: >-
  AdvancedMD publishes list pricing for the SOFTWARE, not for the APIs. The
  /software-pricing/ page carries a per-provider/per-month tier table by specialty,
  an encounter (claims-based) alternative, a percentage-of-collections RCM model,
  an AI add-on, and named migration/setup fee tiers — all quoted below verbatim.
  The API estate is priced separately and on two completely different terms: the
  ONC-certified FHIR APIs are supplied free of charge under the Developer Terms of
  Service, while the proprietary Connect API estate is gated behind a signed
  Certified API Developer Agreement carrying licensing and support fees that
  AdvancedMD does not publish. There is no metered API plan, no per-call price and
  no published API quota anywhere on the public surface.
currency: USD
billing_period: monthly
unit: per provider per month
unit_definition: >-
  "Pricing is based on per provider/per month. A provider is defined as a mid-level
  clinician or higher." — https://www.advancedmd.com/software-pricing/
