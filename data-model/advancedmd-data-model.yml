legacy_application_access_model:
  note: >-
    The legacy Application Access APIs expose a flat, non-FHIR projection of the same
    data. POST /authenticate returns patientdata[] (patientid, name, address, city, state,
    zipcode, dateofbirth) plus a token; every /clinical/* read is then keyed by that
    patientid over a required startDate/endDate window. There are no cross-references
    between the returned objects.
  root: {entity: Patient, key: patientid, tenant_key: officekey}
  objects:
    - Allergy
    - Assessment
    - Goal
    - HealthConcern
    - Immunization
    - ImplantedDevice
    - Medication
    - Order
    - Plan
    - Problem
    - Procedure
    - Provider
    - ResultSet
    - Result
    - SmokingStatus
    - VitalSign
    - VitalMeasurment
  documents:
    - {name: Episode Summary, format: HL7 C-CDA v3 (XML), operation: GET /clinical/episodesummaries}
