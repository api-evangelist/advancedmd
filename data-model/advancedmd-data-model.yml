method: derived
source: >-
  Derived from the component schemas and reference fields in
  openapi/advancedmd-fhir-single-api-openapi.json (patient / subject / encounter /
  managingOrganization / performer / requester / payor …), the resource list in
  fhir/advancedmd-fhir-r4-capabilitystatement.json, and the definitions in
  openapi/advancedmd-application-access-apis-swagger.json. Semantics follow HL7 FHIR R4
  and US Core 6.1.0 — AdvancedMD does not publish its own object reference.
docs: https://fhir.advancedmd.com/fhir/conformance
notation: >-
  relationships use has_one / has_many / belongs_to with the reference field name; the
  direction is from the entity that carries the reference. FHIR references are typed
  strings of the form "<ResourceType>/<id>", not embedded objects.
identifiers:
  scheme: >-
    Opaque server-assigned FHIR logical ids. No id prefixes. Every resource is addressed
    as {orgId}/{ResourceType}/{id} beneath
    https://providerapi.advancedmd.com/v1/r4 — the organization id is part of the identity
    of every record, so ids are only unique within an organization.
  tenant_key: orgId (FHIR path segment) / office key ("license key") on the auth and Bulk surfaces

entities:
  - {name: Organization, domain: administrative, description: An AdvancedMD customer practice. 6048 are published in the endpoint directory with their own FHIR base URL.}
  - {name: Endpoint, domain: administrative, description: The FHIR service base URL for an Organization; published in the public endpoint Bundle.}
  - {name: Location, domain: administrative, description: A physical place of service, managed by an Organization.}
  - {name: Practitioner, domain: administrative, description: A clinician or staff member.}
  - {name: Patient, domain: clinical-core, description: The subject of care and the anchor of every patient-scoped read.}
