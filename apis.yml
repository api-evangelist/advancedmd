- aid: advancedmd:advancedmd-connect-apis
  name: AdvancedMD Connect APIs
  description: >-
    AdvancedMD's proprietary partner API family, published in both XML-RPC and REST
    formats, which lets developers build companion applications that replicate
    functionality available in the AdvancedMD user interface — patient engagement,
    appointment scheduling, clinical forms, payment tools and revenue-cycle management.
    Access is gated: developers must sign a Certified API Developer Agreement (with
    licensing and support fees), then receive sandbox access and documentation on the
    AdvancedMD Developer Portal before production credentials are granted. No endpoints
    or machine-readable specification are published outside that agreement, so none are
    catalogued here.
  humanURL: https://www.advancedmd.com/group-practice/developer-solutions/
  tags:
  - Practice Management
  - Scheduling
  - Revenue Cycle Management
  - Patient Engagement
