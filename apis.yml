apis:
- aid: advancedmd:advancedmd-fhir-single-api
  name: AdvancedMD FHIR Single API (US Core 6.1.0)
  description: >-
    Read-only HL7 FHIR R4 (4.0.1) API for single-patient data access, aligned to the
    HL7 FHIR US Core Implementation Guide STU 6.1.0 and published for ONC (g)(10)
    Cures Act certification. Supports both standalone and EHR launch for patient and
    practitioner SMART apps, with 58 documented paths across 21 FHIR resource types
    (read, search-type, and POST _search), plus the $docref operation. Base URLs are
    organization-specific under https://providerapi.advancedmd.com/v1/r4/{orgId}.
  humanURL: https://fhir.advancedmd.com/fhir/single-api
  baseURL: https://providerapi.advancedmd.com/v1/r4
