- aid: advancedmd:advancedmd-fhir-bulk-api
  name: AdvancedMD FHIR Bulk API
  description: >-
    HL7 FHIR Bulk Data Access (Flat FHIR) API for exporting a patient group's data
    from AdvancedMD. Documented operations cover backend-services token acquisition
    (POST /v1/oauth2/token with client_assertion JWT and system/*.read scope), kicking
    off an export (GET /v1/r4/Group/{groupId}/$export), checking and cancelling export
    status (/v1/fhir-bulk/status), and retrieving exported FHIR entities
    (/v1/fhir-bulk/fhir-resource/{batchId}/{fhirEntity}).
  humanURL: https://fhir.advancedmd.com/fhir/bulk-api
  baseURL: https://providerapi.advancedmd.com
