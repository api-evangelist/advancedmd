- aid: advancedmd:advancedmd-fhir-bulk-jwks-api
  name: AdvancedMD FHIR Bulk JWKS API
  description: >-
    Developer-portal helper API that mints JWT client assertions for testing the FHIR
    Bulk Data workflow. Documented as POST /v1/fhir-jwks/token with a
    grant_type=client_credentials&alg=rsa body, authorized with the Bulk application's
    key and secret over HTTP Basic. AdvancedMD documents this endpoint as test-only —
    production Bulk applications generate and register their own JWTs. No OpenAPI
    snapshot is published for this API on the portal.
  humanURL: https://fhir.advancedmd.com/fhir/bulk-api
