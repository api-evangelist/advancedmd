- aid: advancedmd:advancedmd-application-access-apis
  name: AdvancedMD Application Access APIs (Legacy Patient APIs)
  description: >-
    Non-FHIR REST API family published on the AdvancedMD FHIR portal as "Legacy Patient
    APIs" and titled "AdvancedMD Application Access APIs" in its own Swagger 2.0
    definition (version 1.0.1, supported AdvancedMD v12.6). Eighteen operations over
    https://ptapi.advancedmd.com/pt-api: POST /authenticate exchanges a patient-portal
    username, password and practice office key for a bearer token and the list of
    patients the caller may read, then fifteen read-only /clinical/* endpoints return
    allergies, assessments, goals, health concerns, immunizations, implanted devices,
    medications, orders, plans, problems, procedures, providers, results, smoking status
    and vital signs for a patientid over a required start/end date range. GET
    /clinical/episodesummaries returns an HL7 C-CDA v3 XML document and GET
    /demographics/patients/{patientid} returns demographics. Every call carries an
    `apikey` header alongside the bearer token, and every operation documents a 429
    QuotaViolation response.
  humanURL: https://fhir.advancedmd.com/fhir/apis
  baseURL: https://ptapi.advancedmd.com/pt-api
  tags:
  - Patient Data
  - C-CDA
  - Clinical
  - Healthcare
