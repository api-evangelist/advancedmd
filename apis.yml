- aid: advancedmd:advancedmd-fhir-endpoint-directory
  name: AdvancedMD FHIR Endpoint Directory
  description: >-
    Public, unauthenticated service base URL publication required of ONC-certified API
    suppliers. GET https://providerapi.advancedmd.com/v1/r4/endpoints returns a FHIR
    Bundle of Endpoint and Organization resources for every AdvancedMD customer
    organization with a FHIR service base URL; the same list is also published as a
    downloadable CSV. Updated quarterly.
  humanURL: https://fhir.advancedmd.com/fhir/base-urls
  baseURL: https://providerapi.advancedmd.com/v1/r4
