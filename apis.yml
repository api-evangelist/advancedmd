aid: advancedmd
url: https://raw.githubusercontent.com/api-evangelist/advancedmd/refs/heads/main/apis.yml
name: AdvancedMD
kind: company
description: >-
  AdvancedMD is a cloud practice-management, medical-billing and electronic health
  record (EHR) software company founded in 1999 and headquartered in South Jordan,
  Utah, serving independent ambulatory practices, mental-health and physical-medicine
  clinics, med spas and medical-billing services across the United States. A standalone
  company again since Francisco Partners acquired it from Global Payments in December
  2024, AdvancedMD operates two clearly separated developer surfaces. The first is a
  public, no-cost HL7 FHIR R4 (4.0.1) read-only API estate published for ONC (g)(10)
  Cures Act certification at fhir.advancedmd.com, aligned to the US Core 6.1.0
  Implementation Guide, authorized with SMART-on-FHIR OAuth 2.0 and covering both
  single-patient access and FHIR Bulk Data Access group export. The second is a gated
  proprietary Connect API estate (REST and XML-RPC) plus an ODBC data-access driver,
  which require a signed Certified API Developer Agreement with licensing and support
  fees before sandbox or production credentials are issued.
